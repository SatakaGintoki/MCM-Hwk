<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 4L0 8Z" fill="context-stroke"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;text-anchor:middle;fill:#24364B}
      .pt{text-anchor:start;font-size:21px;font-weight:700}.node{font-size:18px}.bold{font-weight:700}.white{fill:#fff}
      .panel{stroke-width:2;stroke-dasharray:8 6}.edge{fill:none;stroke:#34495E;stroke-width:2;marker-end:url(#arrow)}
      .box{fill:#fff;stroke-width:2}.labelbg{fill:#fff}
    </style>
  </defs>
  <rect width="1100" height="760" fill="#fff"/>

  <!-- four question regions -->
  <rect class="panel" x="25" y="30" width="510" height="285" fill="#F3F8FC" stroke="#4E78A0"/>
  <rect class="panel" x="565" y="30" width="510" height="285" fill="#FFF7EC" stroke="#C6752A"/>
  <rect class="panel" x="25" y="345" width="510" height="285" fill="#F2F8F3" stroke="#4C8C6C"/>
  <rect class="panel" x="565" y="345" width="510" height="285" fill="#FDF2F3" stroke="#B65D63"/>

  <!-- internal connectors -->
  <path class="edge" d="M190 109H210"/><path class="edge" d="M350 109H370"/>
  <path class="edge" d="M440 137V151H280V165"/><path class="edge" d="M280 220V245"/>

  <path class="edge" d="M760 109H790"/>
  <path class="edge" d="M915 137V151H675V165"/>
  <path class="edge" d="M760 192H790"/>
  <path class="edge" d="M915 220V233H815V245"/>

  <path class="edge" d="M230 422H260"/>
  <path class="edge" d="M385 450V465H140V480"/>
  <path class="edge" d="M230 507H260"/>
  <path class="edge" d="M385 535V548H280V560"/>

  <path class="edge" d="M685 450V462H815V475"/>
  <path class="edge" d="M925 450V462H815"/>
  <path class="edge" d="M815 530V542H685V555"/>
  <path class="edge" d="M780 582H810"/>

  <!-- cross-question relations -->
  <path d="M130 270H15V422H50" fill="none" stroke="#4C8C6C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M430 270H550V109H590" fill="none" stroke="#C6752A" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="labelbg" x="516" y="184" width="68" height="23"/><text x="550" y="201" font-size="15" font-weight="700" fill="#A85B17">冻结模型</text>
  <path d="M815 295V330H550V422H590" fill="none" stroke="#B65D63" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M280 610V655H398V680" fill="none" stroke="#596979" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M925 610V655H702V680" fill="none" stroke="#596979" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <text class="pt" x="45" y="61" fill="#315E86">问题一：参数标定与工况预测</text>
  <rect class="box" x="50" y="82" width="140" height="55" fill="#DCEAF5" stroke="#4E78A0"/>
  <text class="node" x="120" y="105"><tspan x="120">附件与</tspan><tspan x="120" dy="22">已知工况</tspan></text>
  <rect class="box" x="210" y="82" width="140" height="55" stroke="#4E78A0"/>
  <text class="node" x="280" y="105"><tspan x="280">环境温度场</tspan><tspan x="280" dy="22">C(x)</tspan></text>
  <rect class="box" x="370" y="82" width="140" height="55" stroke="#4E78A0"/>
  <text class="node" x="440" y="115">瞬态传热模型</text>
  <rect class="box" x="130" y="165" width="300" height="55" stroke="#4E78A0"/>
  <text class="node" x="280" y="198">换热参数辨识与模型检验</text>
  <rect x="130" y="245" width="300" height="50" fill="#3F6F9D" stroke="#3F6F9D" stroke-width="2"/>
  <text class="node bold white" x="280" y="276">指定工况炉温曲线</text>

  <!-- Q3 -->
  <text class="pt" x="585" y="61" fill="#A85B17">问题三：最小热暴露面积优化</text>
  <rect class="box" x="590" y="82" width="170" height="55" fill="#FBE4C6" stroke="#C6752A"/>
  <text class="node" x="675" y="105"><tspan x="675">温区设定与</tspan><tspan x="675" dy="22">传送速度</tspan></text>
  <rect class="box" x="790" y="82" width="250" height="55" stroke="#C6752A"/>
  <text class="node" x="915" y="115">热暴露面积 + 全部工艺约束</text>
  <rect class="box" x="590" y="165" width="170" height="55" stroke="#C6752A"/>
  <text class="node" x="675" y="188"><tspan x="675">差分进化</tspan><tspan x="675" dy="22">全局搜索</tspan></text>
  <rect class="box" x="790" y="165" width="250" height="55" stroke="#C6752A"/>
  <text class="node" x="915" y="198">COBYLA 边界精修</text>
  <rect x="650" y="245" width="330" height="50" fill="#B96519" stroke="#B96519" stroke-width="2"/>
  <text class="node bold white" x="815" y="276">细网格复核与稳健方案</text>

  <!-- Q2 -->
  <text class="pt" x="45" y="376" fill="#347052">问题二：最大允许传送速度</text>
  <rect class="box" x="50" y="395" width="180" height="55" fill="#DDEEE2" stroke="#4C8C6C"/>
  <text class="node" x="140" y="418"><tspan x="140">冻结模型与</tspan><tspan x="140" dy="22">候选速度</tspan></text>
  <rect class="box" x="260" y="395" width="250" height="55" stroke="#4C8C6C"/>
  <text class="node" x="385" y="428">峰值、斜率及特征时长</text>
  <rect class="box" x="50" y="480" width="180" height="55" stroke="#4C8C6C"/>
  <text class="node" x="140" y="513">速度区间扫描</text>
  <rect class="box" x="260" y="480" width="250" height="55" stroke="#4C8C6C"/>
  <text class="node" x="385" y="513">Brent 边界求根与双侧复核</text>
  <rect x="130" y="560" width="300" height="50" fill="#3D7B5B" stroke="#3D7B5B" stroke-width="2"/>
  <text class="node bold white" x="280" y="591">最大允许速度</text>

  <!-- Q4 -->
  <text class="pt" x="585" y="376" fill="#93434A">问题四：面积—对称性协调优化</text>
  <rect class="box" x="590" y="395" width="190" height="55" fill="#F6DADC" stroke="#B65D63"/>
  <text class="node" x="685" y="428">峰值镜像误差</text>
  <rect class="box" x="810" y="395" width="230" height="55" stroke="#B65D63"/>
  <text class="node" x="925" y="428">热暴露面积</text>
  <rect class="box" x="650" y="475" width="330" height="55" stroke="#B65D63"/>
  <text class="node" x="815" y="508">双目标：面积与对称性</text>
  <rect class="box" x="590" y="555" width="190" height="55" stroke="#B65D63"/>
  <text class="node" x="685" y="588">ε-约束搜索</text>
  <rect x="810" y="555" width="230" height="55" fill="#A64F57" stroke="#A64F57" stroke-width="2"/>
  <text class="node bold white" x="925" y="588">Pareto 前沿与方案选择</text>

  <!-- unified verification -->
  <rect x="170" y="680" width="760" height="60" fill="#F4F5F6" stroke="#596979" stroke-width="2"/>
  <text x="550" y="705" font-size="18" font-weight="700">统一复核与结果输出</text>
  <text x="550" y="729" font-size="16">时间步收敛 · 参数灵敏度 · GA/PSO 对照 · 约束回代</text>
</svg>
